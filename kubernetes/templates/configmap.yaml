apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ .Chart.Name }}-configmap

data:
    application.yaml: |
        server:
            port: 8080
            compression:
                enabled: true
                mime-types: text/html,text/xml,text/plain,text/css, application/javascript, application/json
                min-response-size: 1024
            servlet:
                session:
                    cookie:
                        http-only: true
                context-path: /pep/restaurant/bff
        keycloak:
            realm: "{{ .Values.app.properties.keycloak_realm}}"
            auth-server-url: "{{ .Values.app.properties.keycloak_auth_server_url}}"
            ssl-required: external
            resource: "{{ .Values.app.properties.keycloak_realm}}"
            credentials:
                secret: "{{ .Values.app.properties.keycloak_secret}}"
            use-resource-role-mappings: true
        application:
            keycloak:
                serverUrl: "{{ .Values.app.properties.keycloak_auth_server_url}}"
                realm: "{{ .Values.app.properties.keycloak_realm}}"
                username: "{{ .Values.app.properties.keycloak_username}}"
                password: "{{ .Values.app.properties.keycloak_password}}"
                clientId: "{{ .Values.app.properties.keycloak_realm}}"
                clientSecret: "{{ .Values.app.properties.keycloak_secret}}"
            msManager:
                url: http://pep-restaurant-ms-manager:80/pep/restaurant/manager
            here:
                accessKeyId: "{{ .Values.app.properties.here_accessKeyId}}"
                accessKeySecret: "{{ .Values.app.properties.here_accessKeySecret}}"
                tokenEndpointUrl: "{{ .Values.app.properties.here_tokenEndpointUrl}}"
                herePlacesApiUrl: "{{ .Values.app.properties.here_herePlacesApiUrl}}"

