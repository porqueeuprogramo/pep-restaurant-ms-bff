# Default values for pep-restaurant-ms-bff.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

orbitProductName: pep

image:
  repository: pep-restaurant-ms-bff
  pullPolicy: Never
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

app:
  properties:
    accountId: ""
    springActiveProfiles: "prod"
    environment: "local"
    hub: "pep"
    content: "pep"
    subContent: ""
    arn_prefix: "arn:aws"
    multipart_max_size: "20MB"
    http_ssl_validation: "true"
    keycloak_realm: peprestaurant
    keycloak_auth_server_url: http://host.docker.internal:8081/
    keycloak_resource: peprestaurant
    keycloak_secret: nbH4sSavmupKJ4AsRa9EFAq0k8u9XmaU
    keycloak_username: admin
    keycloak_password: admin
    here_accessKeyId: c0HPuwhJN9Ws7U6Gje9V6w
    here_accessKeySecret: rtwIH9Q7F9VOxh-YasfM3ffu5D5uKLZrbVk9DEJ6xIgVR_kh9ssU1RizN_k3-UEnYODts0oRzWmGYoli0xDqvw
    here_tokenEndpointUrl: https://account.api.here.com/oauth2/token
    here_herePlacesApiUrl: https://places.ls.hereapi.com/places/v1/discover/here


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::905418115951:role/eks-cluster-pep"
    eks.amazonaws.com/audience: "sts.amazonaws.com"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "pep-restaurant-ms-bff-user"

podAnnotations:
  oneagent.dynatrace.com/inject: "true"
  oneagent.dynatrace.com/flavor: "musl"

podSecurityContext: { }
# fsGroup: 2000

securityContext: 
    allowPrivilegeEscalation: false
    capabilities:
        drop: [ "ALL" ]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
        type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080
  actuatorPath: "/actuator/health"
  prometheusPath: "/actuator/prometheus"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 85

nodeSelector: { }

tolerations: [ ]

affinity: { }